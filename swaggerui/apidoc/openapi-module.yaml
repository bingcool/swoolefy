                  - data
  /api/v1/dashboard/execution-trend:
    get:
      tags:
        - CronManager
      summary: 执行趋势
      operationId: getCronTaskManagerControllerExecutionTrend
      parameters:
        -
          name: range
          in: query
          required: false
          schema:
            type: string
          description: '时间范围：24h / 7d / 15d'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      buckets: { type: array, items: { type: string } }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/dashboard/overview:
    get:
      tags:
        - CronManager
      summary: 'Dashboard 概览'
      operationId: getCronTaskManagerControllerDashboardOverview
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      overview: { type: object, properties: { tasks: { type: array, items: { type: string }, description: 任务计数 }, executions: { type: array, items: { type: string }, description: '今日执行计数：与趋势同源 COUNT(DISTINCT exec_batch_id)；today=success+failed+timeout（不含 skipped）' }, nodes: { type: array, items: { type: string }, description: '节点计数；online 按各节点 heartbeat_interval 的存活公式判定' } } }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
