      tags:
        - Agent
      summary: '同步 Tool 对话（天气）。'
      operationId: postAgentToolControllerWeather
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/tool/weather/stream:
    post:
      tags:
        - Agent
      summary: 'SSE 流式 Tool 对话（天气）。'
      operationId: postAgentToolControllerWeatherStream
      responses:
