openapi: 3.0.3
info:
  title: 业务模块
  description: 'Rag/Agent/Workflow/Order/Research/Outdoor/Mcp 模块路由'
  version: 1.0.0
paths:
  /api/v1/agent/capability/chat:
    post:
      tags:
        - Agent
      summary: '完整测试：Capability 解析后注入 CapabilityToolAgent，并执行对话。'
      operationId: postAgentCapabilityControllerChat
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/capability/resolve:
    post:
      tags:
        - Agent
      summary: '仅解析 Capability，返回 selectedTools（不请求 LLM）。'
      operationId: postAgentCapabilityControllerResolve
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/chat:
    post:
      tags:
        - Agent
      summary: 'curl -X POST http://localhost:9501/api/v1/agent/chat -H "Content-Type: application/json" -d ''{"message":"你好","sessionId":"s1","userId":"u1","provider":"deepseek"}'''
      operationId: postAgentChatControllerChat
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      threadId: { type: string, description: '会话线程 ID（userId:sessionId）' }
                      message: { type: string, description: 用户输入消息 }
                      reply: { type: string, description: 助手回复内容 }
                      provider: { type: string, description: 模型提供者别名（ai_model_providers） }
                      model: { type: string, nullable: true, description: '模型名称；未指定时为 null' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/chat-persist:
    post:
      tags:
        - Agent
      summary: 'SQL 持久化多轮会话（与 chat 相同记忆后端，显式返回 historyCount）。'
      operationId: postAgentChatControllerChatPersist
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      threadId: { type: string, description: '会话线程 ID（userId:sessionId）' }
                      message: { type: string, description: 用户输入消息 }
                      reply: { type: string, description: 助手回复内容 }
                      provider: { type: string, description: 模型提供者别名（ai_model_providers） }
                      model: { type: string, nullable: true, description: '模型名称；未指定时为 null' }
                      persisted: { type: boolean, description: '是否已写入 SQL 记忆' }
                      historyCount: { type: integer, description: 当前会话历史消息条数（含本轮） }
                      memory: { type: string, description: '记忆后端标识，如 sql' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/chat-thinking:
    post:
      tags:
        - Agent
      summary: 'DeepSeek 思考模式对话。'
      operationId: postAgentChatControllerChatThinking
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      threadId: { type: string, description: '会话线程 ID（userId:sessionId）' }
                      message: { type: string, description: 用户输入消息 }
                      reply: { type: string, description: 助手回复内容 }
                      reasoning_content: { type: string, nullable: true, description: '思考过程内容（DeepSeek reasoning）；无则为 null' }
                      provider: { type: string, description: 模型提供者别名 }
                      model: { type: string, description: 模型名称 }
                      thinking: { type: string, description: '思考模式：enabled | disabled' }
                      reasoning_effort: { type: string, nullable: true, description: '推理强度：high | max；thinking=disabled 时为 null' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/chat1:
    post:
      tags:
        - Agent
      summary: '指定模型提供者对话（provider 必填）。'
      operationId: postAgentChatControllerChat1
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      threadId: { type: string, description: '会话线程 ID（userId:sessionId）' }
                      message: { type: string, description: 用户输入消息 }
                      reply: { type: string, description: 助手回复内容 }
                      provider: { type: string, description: 模型提供者别名（ai_model_providers） }
                      model: { type: string, nullable: true, description: '模型名称；未指定时为 null' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/heartbeat:
    post:
      tags:
        - CronManager
      summary: 'Agent 心跳上报'
      operationId: postCronTaskManagerControllerAgentHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: integer
                  description: '节点 ID'
              required:
                - nodeId
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      nodeId: { type: integer, description: '节点 ID' }
                      alive: { type: boolean, description: 是否存活 }
                      serverTime: { type: string, description: 服务端当前时间 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/middleware/chat:
    post:
      tags:
        - Agent
      summary: '挂载 Middleware 后执行对话，返回 recorder 调用统计。'
      operationId: postAgentMiddlewareControllerChat
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/polish/recommendation:
    post:
      tags:
        - Agent
      summary: '根据 JSON 履历生成推荐信。'
      operationId: postAgentPolishControllerRecommendation
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/report:
    post:
      tags:
        - CronManager
      summary: 'Agent 上报任务执行结果'
      operationId: postCronTaskManagerControllerAgentReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cronId:
                  type: integer
                  description: 'Cron 任务 ID'
                message:
                  type: string
                  description: 运行日志消息
                taskItem:
                  nullable: true
                  description: 任务项快照（任意结构）
                execBatchId:
                  type: string
                  nullable: true
                  description: '执行批次 ID'
                pid:
                  type: integer
                  nullable: true
                  description: '进程 PID'
                status:
                  type: integer
                  description: '结构化执行状态 0-6；缺省不从 message 猜测'
                triggerType:
                  type: integer
                  description: '触发类型：1-scheduler 2-run_once'
                durationMs:
                  type: integer
                  description: 执行耗时毫秒
                exitCode:
                  type: integer
                  description: 'Shell 退出码'
                httpStatus:
                  type: integer
                  description: 'HTTP 状态码'
              required:
                - cronId
                - message
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      saved: { type: boolean, description: 是否已保存 }
                      cronId: { type: integer, description: 'Cron 任务 ID' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/stream/chat:
    post:
      tags:
        - Agent
      summary: 'SSE 流式对话（ChatAgent + SQL 记忆）。'
      operationId: postAgentStreamControllerChat
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: string
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/tasks:
    get:
      tags:
        - CronManager
      summary: 'Agent 拉取待执行的定时任务'
      operationId: getCronTaskManagerControllerAgentTasks
      parameters:
        -
          name: nodeId
          in: query
          required: true
          schema:
            type: integer
          description: '节点 ID'
        -
          name: execType
          in: query
          required: false
          schema:
            type: integer
            nullable: true
          description: '执行类型：1 shell，2 http；省略则返回全部'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      nodeId: { type: integer, description: '节点 ID' }
                      total: { type: integer, description: 任务条数 }
                      execType: { type: integer, nullable: true, description: 执行类型（单类型查询时返回） }
                      list: { type: array, items: { nullable: true }, nullable: true, description: '任务列表（指定 execType 时）' }
                      shellTasks: { type: array, items: { nullable: true }, nullable: true, description: 'Shell 任务列表' }
                      httpTasks: { type: array, items: { nullable: true }, nullable: true, description: 'HTTP 任务列表' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/tool/weather:
