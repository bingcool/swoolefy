                  - data
  /api/v1/agent/weather:
    post:
      tags:
        - Agent
      summary: 查询城市天气（结构化输出）。
      operationId: postAgentStructuredControllerWeather
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: array
                    items:
                      type: string
                required:
                  - code
                  - msg
