                  description: 任务名称
                expression:
                  type: string
                  description: 'Cron 表达式'
                command:
                  type: string
                  description: '执行命令或 URL'
                execType:
                  type: integer
                  description: '执行类型：1 shell，2 http'
                nodeId:
                  type: integer
                  description: '节点 ID'
                description:
                  type: string
                  nullable: true
                  description: 描述
                status:
                  type: integer
                  nullable: true
                  description: '状态：0 禁用，1 启用'
                withBlockLapping:
                  type: integer
                  nullable: true
                  description: '是否阻塞重叠执行：0 否，1 是'
                httpMethod:
                  type: string
                  nullable: true
                  description: 'HTTP 方法'
                httpRequestTimeOut:
                  type: integer
                  nullable: true
                  description: 'HTTP 超时（秒）'
                cronBetween:
                  type: array
                  items:
                    type: object
                    properties:
                      start: { type: string, description: 时间段开始 }
                      end: { type: string, description: 时间段结束 }
                    required:
                      - start
                      - end
                  description: 允许执行时间段列表
                cronSkip:
                  type: array
                  items:
                    type: object
                    properties:
                      start: { type: string, description: 时间段开始 }
                      end: { type: string, description: 时间段结束 }
                    required:
                      - start
                      - end
                  description: 需跳过的时间段列表
                httpBody:
                  type: array
                  items:
