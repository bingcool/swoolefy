<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swoolefy Cron Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .app-wrapper { display: flex; height: 100%; }
    .sidebar { width: 210px; background: #304156; color: #bfcbd9; flex-shrink: 0; overflow: auto; }
    .brand { padding: 20px 16px 12px; color: #fff; font-weight: 700; font-size: 16px; }
    .brand small { display: block; color: #909399; font-weight: 400; font-size: 12px; margin-top: 4px; }
    .sidebar .el-menu { border-right: 0; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f0f2f5; }
    .navbar { height: 50px; background: #fff; box-shadow: 0 1px 4px rgba(0,21,41,.08); display: flex; align-items: center; padding: 0 20px; }
    .content { padding: 16px 20px 24px; overflow: auto; flex: 1; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .editor-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 16px; align-items: start; }
    .preview-card { position: sticky; top: 8px; }
    .expr-types { display: flex; gap: 10px; margin-bottom: 12px; }
    .expr-type { flex: 1; border: 1px solid #dcdfe6; border-radius: 6px; padding: 10px 12px; cursor: pointer; background: #fff; }
    .expr-type.active { border-color: #409eff; background: #ecf5ff; }
    .expr-type small { display: block; color: #909399; margin-top: 4px; }
    .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ebeef5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .callout { background: #fdf6ec; border: 1px solid #faecd8; color: #e6a23c; border-radius: 4px; padding: 10px; font-size: 12px; line-height: 1.6; margin-top: 12px; }
    .callout.info { background: #ecf5ff; border-color: #d9ecff; color: #409eff; }
    @media (max-width: 1100px) { .stat-row, .editor-layout { grid-template-columns: 1fr; } .sidebar { width: 180px; } }
  </style>
</head>
<body>
<div id="app">
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">Swoolefy Cron<small>Production Admin</small></div>
      <el-menu :default-active="$route.path" background-color="#304156" text-color="#bfcbd9" active-text-color="#409EFF" router>
        <el-menu-item index="/dashboard"><i class="el-icon-data-line"></i><span>Dashboard</span></el-menu-item>
        <el-menu-item index="/tasks"><i class="el-icon-s-order"></i><span>计划任务</span></el-menu-item>
        <el-menu-item index="/executions"><i class="el-icon-time"></i><span>执行记录</span></el-menu-item>
        <el-menu-item index="/nodes"><i class="el-icon-monitor"></i><span>Cron Nodes</span></el-menu-item>
        <el-menu-item index="/runtime"><i class="el-icon-odometer"></i><span>Runtime</span></el-menu-item>
      </el-menu>
    </aside>
    <section class="main">
      <header class="navbar">
        <el-breadcrumb separator="/">
          <el-breadcrumb-item>Cron Admin</el-breadcrumb-item>
          <el-breadcrumb-item>{{ breadcrumb }}</el-breadcrumb-item>
        </el-breadcrumb>
      </header>
      <div class="content"><router-view></router-view></div>
    </section>
  </div>
</div>

<script type="text/x-template" id="tpl-dashboard">
  <div>
    <div class="page-head"><div><h2 style="margin:0">Dashboard</h2><p style="color:#909399;margin:6px 0 0">任务、今日执行与节点心跳聚合</p></div></div>
    <div class="stat-row">
      <el-card shadow="never"><div>任务总数</div><h2>{{ overview.tasks.total }}</h2><div>启用 {{ overview.tasks.enabled }} / 禁用 {{ overview.tasks.disabled }}</div></el-card>
      <el-card shadow="never"><div>今日执行</div><h2>{{ overview.executions.today }}</h2><div>成功 {{ overview.executions.success }} / 失败 {{ overview.executions.failed }}</div></el-card>
      <el-card shadow="never"><div>节点</div><h2>{{ overview.nodes.total }}</h2><div>在线 {{ overview.nodes.online }} / 离线 {{ overview.nodes.offline }} / 未知 {{ overview.nodes.unknown }}</div></el-card>
      <el-card shadow="never"><div>跳过</div><h2>{{ overview.executions.skipped }}</h2><div>今日 SKIP</div></el-card>
    </div>
    <el-card shadow="never">
      <div slot="header" class="clearfix">
        <span>执行趋势</span>
        <el-radio-group v-model="range" size="mini" style="float:right" @change="loadTrend">
          <el-radio-button label="24h">24h</el-radio-button>
          <el-radio-button label="7d">7d</el-radio-button>
          <el-radio-button label="30d">30d</el-radio-button>
        </el-radio-group>
      </div>
      <el-table :data="trend" size="small">
        <el-table-column prop="time" label="时间"></el-table-column>
        <el-table-column prop="total" label="总计"></el-table-column>
        <el-table-column prop="success" label="成功"></el-table-column>
        <el-table-column prop="failed" label="失败"></el-table-column>
      </el-table>
    </el-card>
  </div>
</script>

<script type="text/x-template" id="tpl-tasks">
  <div>
    <div class="page-head">
      <div><h2 style="margin:0">计划任务</h2><p style="color:#909399;margin:6px 0 0">配置写入 cron_task，Worker Polling 后生效</p></div>
      <el-button type="primary" icon="el-icon-plus" @click="$router.push('/tasks/create')">创建任务</el-button>
    </div>
    <el-card shadow="never">
      <el-form :inline="true" size="small" @submit.native.prevent="search">
        <el-form-item label="关键词"><el-input v-model="query.keyword" clearable placeholder="任务名称"></el-input></el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" clearable placeholder="全部" style="width:110px">
            <el-option :value="1" label="启用"></el-option>
            <el-option :value="0" label="禁用"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="节点">
          <el-select v-model="query.nodeId" clearable placeholder="全部" style="width:160px">
            <el-option v-for="n in nodes" :key="n.id" :value="n.id" :label="n.nodeName"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="query.execType" clearable placeholder="全部" style="width:110px">
            <el-option :value="1" label="Shell"></el-option>
            <el-option :value="2" label="HTTP"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item><el-button type="primary" @click="search">查询</el-button></el-form-item>
      </el-form>
      <el-table :data="items" v-loading="loading" @selection-change="sel=$event">
        <el-table-column type="selection" width="42"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="140"></el-table-column>
        <el-table-column prop="expression" label="Expression" width="140"><template slot-scope="s"><span class="mono">{{ s.row.expression }}</span><el-tag size="mini" style="margin-left:6px">{{ s.row.expressionType }}</el-tag></template></el-table-column>
        <el-table-column prop="nodeId" label="Node" width="70"></el-table-column>
        <el-table-column label="Type" width="80"><template slot-scope="s"><el-tag size="mini" :type="s.row.execType===2?'warning':'primary'">{{ s.row.execType===2?'HTTP':'Shell' }}</el-tag></template></el-table-column>
        <el-table-column label="Status" width="80"><template slot-scope="s"><el-tag size="mini" :type="s.row.status===1?'success':'info'">{{ s.row.status===1?'启用':'禁用' }}</el-tag></template></el-table-column>
        <el-table-column prop="retry" label="Retry" width="70"></el-table-column>
        <el-table-column prop="updatedAt" label="Updated" width="160"></el-table-column>
        <el-table-column label="操作" width="280" fixed="right">
          <template slot-scope="s">
            <el-button type="text" @click="$router.push('/tasks/detail/'+s.row.id)">详情</el-button>
            <el-button type="text" @click="$router.push('/tasks/edit/'+s.row.id)">编辑</el-button>
            <el-button type="text" @click="toggle(s.row)">{{ s.row.status===1?'停用':'启用' }}</el-button>
            <el-button type="text" @click="runOnce(s.row)">执行一次</el-button>
            <el-button type="text" @click="dup(s.row)">复制</el-button>
            <el-button type="text" style="color:#f56c6c" @click="remove(s.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <el-button size="mini" :disabled="!sel.length" @click="batch(1)">批量启用</el-button>
          <el-button size="mini" :disabled="!sel.length" @click="batch(0)">批量停用</el-button>
        </div>
        <el-pagination background layout="total, prev, pager, next" :total="total" :page-size="query.pageSize" :current-page.sync="query.page" @current-change="load"></el-pagination>
      </div>
    </el-card>
  </div>
</script>

<script type="text/x-template" id="tpl-editor">
  <div>
    <div class="page-head">
      <div>
        <h2 style="margin:0">{{ isEdit ? '编辑计划任务' : '创建计划任务' }}</h2>
        <p style="color:#909399;margin:6px 0 0">配置调度规则、执行方式以及运行策略</p>
      </div>
      <div>
        <el-button @click="$router.push('/tasks')">取消</el-button>
        <el-button type="primary" :loading="saving" @click="save">保存任务</el-button>
      </div>
    </div>
    <div class="editor-layout">
      <el-card shadow="never">
        <h3>基础信息</h3>
        <el-form label-width="110px" size="small">
          <el-form-item label="任务名称" required><el-input v-model="form.name" placeholder="例如：订单同步"></el-input></el-form-item>
          <el-form-item label="执行节点" required>
            <el-select v-model="form.nodeId" style="width:100%">
              <el-option v-for="n in nodes" :key="n.id" :value="n.id" :label="n.nodeName+'（'+n.nodeIp+'）'"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="描述"><el-input type="textarea" v-model="form.description"></el-input></el-form-item>
        </el-form>
        <h3>调度配置</h3>
        <div class="expr-types">
          <div class="expr-type" :class="{active: exprType==='interval'}" @click="setExprType('interval')"><b>每 N 秒</b><small>适合 15s、30s 等高频任务（引擎下限 5 秒）</small></div>
          <div class="expr-type" :class="{active: exprType==='cron'}" @click="setExprType('cron')"><b>Linux Cron</b><small>分钟级标准 Cron 表达式</small></div>
        </div>
        <el-form label-width="110px" size="small" v-if="exprType==='interval'">
          <el-form-item label="间隔（秒）" required><el-input-number v-model="intervalSec" :min="5" @change="previewExpr"></el-input-number></el-form-item>
        </el-form>
        <el-form label-width="110px" size="small" v-else>
          <el-form-item label="Cron 表达式" required><el-input class="mono" v-model="cronExpr" placeholder="*/5 * * * *" @input="previewExpr"></el-input></el-form-item>
        </el-form>
        <el-alert :title="preview.valid ? '表达式有效' : '表达式无效'" :type="preview.valid?'success':'error'" :description="preview.description" show-icon :closable="false"></el-alert>
        <div style="margin-top:8px">
          <el-tag v-for="t in preview.nextRuns" :key="t" size="mini" style="margin:0 6px 6px 0">{{ t }}</el-tag>
        </div>
        <h3>执行配置</h3>
        <el-radio-group v-model="form.execType" size="small" style="margin-bottom:12px">
          <el-radio-button :label="1">Shell</el-radio-button>
          <el-radio-button :label="2">HTTP</el-radio-button>
        </el-radio-group>
        <el-form label-width="110px" size="small" v-if="form.execType===1">
          <el-form-item label="Command" required><el-input type="textarea" class="mono" v-model="form.command"></el-input></el-form-item>
        </el-form>
        <el-form label-width="110px" size="small" v-else>
          <el-form-item label="Request URL" required><el-input v-model="form.command"></el-input></el-form-item>
          <el-form-item label="HTTP Method">
            <el-select v-model="form.httpMethod"><el-option label="GET" value="GET"></el-option><el-option label="POST" value="POST"></el-option><el-option label="PUT" value="PUT"></el-option><el-option label="DELETE" value="DELETE"></el-option></el-select>
          </el-form-item>
          <el-form-item label="Timeout（秒）"><el-input-number v-model="form.httpRequestTimeOut" :min="0"></el-input-number></el-form-item>
          <el-form-item label="HTTP Headers"><el-input type="textarea" class="mono" v-model="headersText" placeholder='{"Content-Type":"application/json"}'></el-input></el-form-item>
          <el-form-item label="HTTP Body"><el-input type="textarea" class="mono" v-model="bodyText"></el-input></el-form-item>
        </el-form>
        <h3>执行策略</h3>
        <el-form label-width="110px" size="small">
          <el-form-item label="阻塞重叠"><el-switch v-model="form.withBlockLapping" :active-value="1" :inactive-value="0"></el-switch></el-form-item>
          <el-form-item label="失败重试"><el-input-number v-model="form.retry" :min="0"></el-input-number><span style="margin-left:8px;color:#909399">不含首次；0=不重试</span></el-form-item>
          <el-form-item label="cron_between"><el-input type="textarea" class="mono" v-model="betweenText" placeholder='[{"start":"09:00","end":"18:00"}]'></el-input></el-form-item>
          <el-form-item label="cron_skip"><el-input type="textarea" class="mono" v-model="skipText" placeholder='[{"start":"12:00","end":"13:00"}]'></el-input></el-form-item>
          <el-form-item :label="isEdit?'启用状态':'创建后启用'"><el-switch v-model="form.status" :active-value="1" :inactive-value="0"></el-switch></el-form-item>
        </el-form>
        <div style="text-align:right" v-if="isEdit">
          <el-button type="danger" plain @click="remove">删除任务</el-button>
        </div>
      </el-card>
      <el-card shadow="never" class="preview-card">
        <div style="display:flex;justify-content:space-between"><b>任务预览</b><el-tag size="mini" :type="form.status===1?'success':'info'">{{ form.status===1?'启用':'禁用' }}</el-tag></div>
        <h3>{{ form.name || '未命名任务' }}</h3>
        <p style="color:#909399">{{ form.description || '暂无描述' }}</p>
        <div class="kv"><span>执行节点</span><b>{{ nodeLabel }}</b></div>
        <div class="kv"><span>调度类型</span><b>{{ exprType==='interval'?'每 N 秒':'Linux Cron' }}</b></div>
        <div class="kv"><span>表达式</span><b class="mono">{{ form.expression }}</b></div>
        <div class="kv"><span>执行类型</span><b>{{ form.execType===2?'HTTP':'Shell' }}</b></div>
        <div class="kv"><span>防重叠</span><b>{{ form.withBlockLapping?'是':'否' }}</b></div>
        <div class="kv"><span>Retry</span><b>{{ form.retry }}</b></div>
        <div class="callout">保存后只写入 <span class="mono">cron_task</span>。Cron Worker 通过数据库 Polling 发现配置变化。</div>
        <div class="callout info">Shell Command 属于高风险配置；敏感 Header 不会在详情接口明文回传。</div>
      </el-card>
    </div>
  </div>
</script>

<script type="text/x-template" id="tpl-detail">
  <div>
    <div class="page-head">
      <div><h2 style="margin:0">{{ row.name }}</h2><p style="color:#909399;margin:6px 0 0">任务详情</p></div>
      <div>
        <el-button @click="$router.push('/tasks/edit/'+id)">编辑</el-button>
        <el-button type="primary" @click="runOnce">执行一次</el-button>
      </div>
    </div>
    <el-card shadow="never" v-loading="loading">
      <el-descriptions :column="2" border>
        <el-descriptions-item label="ID">{{ row.id }}</el-descriptions-item>
        <el-descriptions-item label="节点">{{ row.nodeId }}</el-descriptions-item>
        <el-descriptions-item label="表达式"><span class="mono">{{ row.expression }}</span> <el-tag size="mini">{{ row.expressionType }}</el-tag></el-descriptions-item>
        <el-descriptions-item label="类型">{{ row.execType===2?'HTTP':'Shell' }}</el-descriptions-item>
        <el-descriptions-item label="状态"><el-tag :type="row.status===1?'success':'info'" size="mini">{{ row.status===1?'启用':'禁用' }}</el-tag></el-descriptions-item>
        <el-descriptions-item label="Retry">{{ row.retry }}</el-descriptions-item>
        <el-descriptions-item label="防重叠">{{ row.withBlockLapping?'是':'否' }}</el-descriptions-item>
        <el-descriptions-item label="Command" :span="2"><span class="mono">{{ row.command }}</span></el-descriptions-item>
        <el-descriptions-item label="描述" :span="2">{{ row.description || '-' }}</el-descriptions-item>
      </el-descriptions>
    </el-card>
    <el-card shadow="never" style="margin-top:12px" v-if="stats">
      <div slot="header">执行统计</div>
      总计 {{ stats.total }} · 成功 {{ stats.success }} · 失败 {{ stats.failed }} · 跳过 {{ stats.skipped }} · 成功率 {{ stats.successRate }}% · 平均耗时 {{ stats.avgDurationMs }}ms
    </el-card>
  </div>
</script>

<script type="text/x-template" id="tpl-exec">
  <div>
    <div class="page-head"><div><h2 style="margin:0">执行记录</h2></div></div>
    <el-card shadow="never">
      <el-form :inline="true" size="small" @submit.native.prevent="load">
        <el-form-item label="任务ID"><el-input-number v-model="query.taskId" :min="1"></el-input-number></el-form-item>
        <el-form-item label="批次"><el-input v-model="query.execBatchId" clearable></el-input></el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" clearable style="width:120px">
            <el-option value="success" label="成功"></el-option>
            <el-option value="failed" label="失败"></el-option>
            <el-option value="skipped" label="跳过"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item><el-button type="primary" @click="load">查询</el-button></el-form-item>
      </el-form>
      <el-table :data="items" v-loading="loading">
        <el-table-column prop="execBatchId" label="批次" min-width="160"></el-table-column>
        <el-table-column prop="pid" label="PID" width="80"></el-table-column>
        <el-table-column prop="message" label="消息" min-width="280"></el-table-column>
        <el-table-column prop="createdAt" label="时间" width="160"></el-table-column>
        <el-table-column label="操作" width="80"><template slot-scope="s"><el-button type="text" @click="detail(s.row)">详情</el-button></template></el-table-column>
      </el-table>
      <el-pagination style="margin-top:12px" background layout="total, prev, pager, next" :total="total" :page-size="query.pageSize" :current-page.sync="query.page" @current-change="load"></el-pagination>
    </el-card>
    <el-dialog title="执行详情" :visible.sync="dlg" width="640px">
      <pre class="mono" style="white-space:pre-wrap">{{ execDetail }}</pre>
    </el-dialog>
  </div>
</script>

<script type="text/x-template" id="tpl-nodes">
  <div>
    <div class="page-head">
      <div><h2 style="margin:0">Cron Nodes</h2></div>
      <el-button type="primary" @click="open()">新建节点</el-button>
    </div>
    <el-card shadow="never">
      <el-table :data="items" v-loading="loading">
        <el-table-column prop="id" label="ID" width="60"></el-table-column>
        <el-table-column prop="nodeName" label="名称"></el-table-column>
        <el-table-column prop="nodeIp" label="IP"></el-table-column>
        <el-table-column label="状态" width="100"><template slot-scope="s"><el-tag size="mini" :type="s.row.status==='online'?'success':(s.row.status==='offline'?'danger':'info')">{{ s.row.status }}</el-tag></template></el-table-column>
        <el-table-column prop="lastHeartbeatAt" label="心跳" width="160"></el-table-column>
        <el-table-column prop="taskCount" label="任务数" width="80"></el-table-column>
        <el-table-column prop="remark" label="备注"></el-table-column>
        <el-table-column label="操作" width="140">
          <template slot-scope="s">
            <el-button type="text" @click="open(s.row)">编辑</el-button>
            <el-button type="text" style="color:#f56c6c" @click="remove(s.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </el-card>
    <el-dialog :title="form.id?'编辑节点':'新建节点'" :visible.sync="dlg" width="480px">
      <el-form label-width="80px" size="small">
        <el-form-item label="名称"><el-input v-model="form.nodeName"></el-input></el-form-item>
        <el-form-item label="IP"><el-input v-model="form.nodeIp"></el-input></el-form-item>
        <el-form-item label="备注"><el-input v-model="form.remark"></el-input></el-form-item>
      </el-form>
      <span slot="footer"><el-button @click="dlg=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></span>
    </el-dialog>
  </div>
</script>

<script type="text/x-template" id="tpl-runtime">
  <div>
    <div class="page-head"><div><h2 style="margin:0">Runtime</h2></div></div>
    <el-alert :title="overview.note" type="info" :closable="false" style="margin-bottom:12px"></el-alert>
    <div class="stat-row">
      <el-card shadow="never"><div>Jobs</div><h2>{{ overview.scheduler.jobs }}</h2></el-card>
      <el-card shadow="never"><div>Enabled</div><h2>{{ overview.scheduler.enabled }}</h2></el-card>
      <el-card shadow="never"><div>Running</div><h2>{{ overview.scheduler.running }}</h2></el-card>
      <el-card shadow="never"><div>Nodes online</div><h2>{{ overview.nodes.online }}</h2></el-card>
    </div>
    <el-card shadow="never">
      <div class="kv"><span>lastSuccessAt</span><b>{{ overview.sync.lastSuccessAt || '-' }}</b></div>
      <div class="kv"><span>lastErrorAt</span><b>{{ overview.sync.lastErrorAt || '-' }}</b></div>
      <div class="kv"><span>processLocal</span><b>{{ overview.sync.processLocal ? '是' : '否' }}</b></div>
    </el-card>
  </div>
</script>

<script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router@3.6.5/dist/vue-router.js"></script>
<script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script>
// API 与页面同源；code!==0 视为业务失败
const API = '/api/v1';
async function api(path, options) {
  options = options || {};
  const headers = Object.assign({ Accept: 'application/json' }, options.headers || {});
  if (options.body && typeof options.body !== 'string') {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(API + path, Object.assign({}, options, { headers }));
  const json = await res.json();
  if (!res.ok || (json.code !== undefined && json.code !== 0)) {
    throw new Error(json.msg || json.message || ('HTTP ' + res.status));
  }
  return json.data;
}
function toastErr(e) { Vue.prototype.$message.error(e.message || String(e)); }

const Dashboard = {
  template: '#tpl-dashboard',
  data() { return { overview: { tasks:{total:0,enabled:0,disabled:0}, executions:{today:0,success:0,failed:0,skipped:0}, nodes:{total:0,online:0,offline:0,unknown:0} }, trend: [], range: '24h' }; },
  created() { this.load(); this.loadTrend(); },
  methods: {
    async load() { try { this.overview = await api('/dashboard/overview'); } catch (e) { toastErr(e); } },
    async loadTrend() { try { this.trend = await api('/dashboard/execution-trend?range=' + this.range) || []; } catch (e) { toastErr(e); } }
  }
};
const Tasks = {
  template: '#tpl-tasks',
  data() { return { items: [], total: 0, loading: false, nodes: [], sel: [], query: { page: 1, pageSize: 20, keyword: '', status: '', nodeId: '', execType: '' } }; },
  created() { this.loadNodes(); this.load(); },
  methods: {
    async loadNodes() { try { const d = await api('/nodes'); this.nodes = (d && d.list) || []; } catch (e) { toastErr(e); } },
    async load() {
      this.loading = true;
      try {
        const qs = new URLSearchParams();
        Object.keys(this.query).forEach(k => { if (this.query[k] !== '' && this.query[k] !== null) qs.set(k, this.query[k]); });
        const d = await api('/tasks?' + qs.toString());
        this.items = d.items || d.list || [];
        this.total = d.total || 0;
      } catch (e) { toastErr(e); } finally { this.loading = false; }
    },
    search() { this.query.page = 1; this.load(); },
    async toggle(row) {
      try { await api('/tasks/status', { method: 'PUT', body: { id: row.id, status: row.status === 1 ? 0 : 1 } }); this.$message.success('已更新'); this.load(); } catch (e) { toastErr(e); }
    },
    async runOnce(row) {
      try { const d = await api('/tasks/run', { method: 'POST', body: { id: row.id } }); this.$message.success((d && d.message) || '已入队'); } catch (e) { toastErr(e); }
    },
    async dup(row) {
      try { await api('/tasks/duplicate', { method: 'POST', body: { id: row.id } }); this.$message.success('已复制为禁用副本'); this.load(); } catch (e) { toastErr(e); }
    },
    async remove(row) {
      try { await this.$confirm('确认删除 ' + row.name + '？'); await api('/tasks?id=' + encodeURIComponent(row.id), { method: 'DELETE', body: { id: Number(row.id) } }); this.$message.success('已删除'); this.load(); } catch (e) { if (e !== 'cancel') toastErr(e); }
    },
    async batch(status) {
      try { await api('/tasks/batch-status', { method: 'PUT', body: { ids: this.sel.map(x => x.id), status } }); this.$message.success('批量已更新'); this.load(); } catch (e) { toastErr(e); }
    }
  }
};
const Editor = {
  template: '#tpl-editor',
  data() {
    return {
      nodes: [], saving: false, exprType: 'interval', intervalSec: 15, cronExpr: '*/5 * * * *',
      headersText: '', bodyText: '', betweenText: '', skipText: '',
      preview: { valid: true, description: '', nextRuns: [] },
      form: { name: '', nodeId: null, description: '', expression: '15', command: '', execType: 1, status: 1, withBlockLapping: 0, retry: 0, httpMethod: 'GET', httpRequestTimeOut: 30, httpHeaders: null, httpBody: null, cronBetween: null, cronSkip: null }
    };
  },
  computed: {
    isEdit() { return !!this.$route.params.id; },
    nodeLabel() { const n = this.nodes.find(x => x.id === this.form.nodeId); return n ? n.nodeName : '-'; }
  },
  created() { this.init(); },
  methods: {
    async init() {
      try { const d = await api('/nodes'); this.nodes = (d && d.list) || []; if (!this.form.nodeId && this.nodes[0]) this.form.nodeId = this.nodes[0].id; } catch (e) { toastErr(e); }
      if (this.isEdit) {
        try {
          const row = await api('/tasks/detail?id=' + this.$route.params.id);
          this.form = Object.assign(this.form, row);
          this.exprType = row.expressionType || (String(row.expression).match(/^\d+$/) ? 'interval' : 'cron');
          if (this.exprType === 'interval') this.intervalSec = parseInt(row.expression, 10) || 15; else this.cronExpr = row.expression;
          this.headersText = row.httpHeaders ? JSON.stringify(row.httpHeaders, null, 2) : '';
          this.bodyText = row.httpBody ? JSON.stringify(row.httpBody, null, 2) : '';
          this.betweenText = row.cronBetween && row.cronBetween.length ? JSON.stringify(row.cronBetween, null, 2) : '';
          this.skipText = row.cronSkip && row.cronSkip.length ? JSON.stringify(row.cronSkip, null, 2) : '';
        } catch (e) { toastErr(e); }
      }
      this.previewExpr();
    },
    setExprType(t) { this.exprType = t; this.previewExpr(); },
    syncExpr() { this.form.expression = this.exprType === 'interval' ? String(this.intervalSec || 15) : (this.cronExpr || ''); },
    async previewExpr() {
      this.syncExpr();
      try { this.preview = await api('/tasks/expression/preview', { method: 'POST', body: { expression: this.form.expression } }); }
      catch (e) { this.preview = { valid: false, description: e.message, nextRuns: [] }; }
    },
    parseJson(text, label) {
      if (!text || !String(text).trim()) return null;
      try { return JSON.parse(text); } catch (e) { throw new Error(label + ' JSON 无效'); }
    },
    async save() {
      this.syncExpr();
      if (!this.form.name || !this.form.command || !this.form.nodeId) { this.$message.warning('请填写名称、节点与 Command/URL'); return; }
      if (!this.preview.valid) { this.$message.warning('请先修正表达式'); return; }
      try {
        const payload = Object.assign({}, this.form, {
          httpHeaders: this.parseJson(this.headersText, 'Headers'),
          httpBody: this.parseJson(this.bodyText, 'Body'),
          cronBetween: this.parseJson(this.betweenText, 'cron_between'),
          cronSkip: this.parseJson(this.skipText, 'cron_skip')
        });
        this.saving = true;
        if (this.isEdit) await api('/tasks', { method: 'PUT', body: payload });
        else await api('/tasks', { method: 'POST', body: payload });
        this.$message.success('已保存');
        this.$router.push('/tasks');
      } catch (e) { toastErr(e); } finally { this.saving = false; }
    },
    async remove() {
      try { await this.$confirm('确认删除？'); await api('/tasks?id=' + encodeURIComponent(this.form.id), { method: 'DELETE', body: { id: Number(this.form.id) } }); this.$router.push('/tasks'); } catch (e) { if (e !== 'cancel') toastErr(e); }
    }
  }
};
const Detail = {
  template: '#tpl-detail',
  data() { return { row: {}, stats: null, loading: false }; },
  computed: { id() { return this.$route.params.id; } },
  created() { this.load(); },
  methods: {
    async load() {
      this.loading = true;
      try { this.row = await api('/tasks/detail?id=' + this.id); this.stats = await api('/tasks/stats?taskId=' + this.id); }
      catch (e) { toastErr(e); } finally { this.loading = false; }
    },
    async runOnce() {
      try { const d = await api('/tasks/run', { method: 'POST', body: { id: Number(this.id) } }); this.$message.success((d && d.message) || '已入队'); } catch (e) { toastErr(e); }
    }
  }
};
const Executions = {
  template: '#tpl-exec',
  data() { return { items: [], total: 0, loading: false, dlg: false, execDetail: '', query: { taskId: 1, page: 1, pageSize: 20, execBatchId: '', status: '' } }; },
  created() { if (this.$route.query.taskId) this.query.taskId = Number(this.$route.query.taskId); this.load(); },
  methods: {
    async load() {
      this.loading = true;
      try {
        const qs = new URLSearchParams({ taskId: this.query.taskId, page: this.query.page, pageSize: this.query.pageSize });
        if (this.query.execBatchId) qs.set('execBatchId', this.query.execBatchId);
        if (this.query.status) qs.set('status', this.query.status);
        const d = await api('/tasks/logs?' + qs.toString());
        this.items = (d && d.list) || [];
        this.total = (d && d.total) || 0;
      } catch (e) { toastErr(e); } finally { this.loading = false; }
    },
    async detail(row) {
      try { this.execDetail = JSON.stringify(await api('/tasks/execution?id=' + this.query.taskId + '&execBatchId=' + encodeURIComponent(row.execBatchId)), null, 2); this.dlg = true; }
      catch (e) { toastErr(e); }
    }
  }
};
const Nodes = {
  template: '#tpl-nodes',
  data() { return { items: [], loading: false, dlg: false, form: { id: 0, nodeName: '', nodeIp: '', remark: '' } }; },
  created() { this.load(); },
  methods: {
    async load() { this.loading = true; try { const d = await api('/nodes'); this.items = (d && d.list) || []; } catch (e) { toastErr(e); } finally { this.loading = false; } },
    open(row) { this.form = row ? { id: row.id, nodeName: row.nodeName, nodeIp: row.nodeIp, remark: row.remark } : { id: 0, nodeName: '', nodeIp: '', remark: '' }; this.dlg = true; },
    async save() {
      try {
        if (this.form.id) await api('/nodes', { method: 'PUT', body: this.form });
        else await api('/nodes', { method: 'POST', body: this.form });
        this.dlg = false; this.load();
      } catch (e) { toastErr(e); }
    },
    async remove(row) {
      try { await this.$confirm('确认删除节点？'); await api('/nodes', { method: 'DELETE', body: { id: row.id } }); this.load(); } catch (e) { if (e !== 'cancel') toastErr(e); }
    }
  }
};
const Runtime = {
  template: '#tpl-runtime',
  data() { return { overview: { scheduler:{jobs:0,enabled:0,running:0}, sync:{lastSuccessAt:null,lastErrorAt:null,processLocal:true}, nodes:{online:0,offline:0}, note: '' } }; },
  created() { this.load(); },
  methods: { async load() { try { this.overview = await api('/runtime/overview'); } catch (e) { toastErr(e); } } }
};

const router = new VueRouter({
  routes: [
    { path: '/', redirect: '/dashboard' },
    { path: '/dashboard', component: Dashboard, meta: { title: 'Dashboard' } },
    { path: '/tasks', component: Tasks, meta: { title: '计划任务' } },
    { path: '/tasks/create', component: Editor, meta: { title: '创建任务' } },
    { path: '/tasks/edit/:id', component: Editor, meta: { title: '编辑任务' } },
    { path: '/tasks/detail/:id', component: Detail, meta: { title: '任务详情' } },
    { path: '/executions', component: Executions, meta: { title: '执行记录' } },
    { path: '/nodes', component: Nodes, meta: { title: 'Cron Nodes' } },
    { path: '/runtime', component: Runtime, meta: { title: 'Runtime' } }
  ]
});
new Vue({
  el: '#app',
  router,
  computed: { breadcrumb() { return (this.$route.meta && this.$route.meta.title) || ''; } }
});
</script>
</body>
</html>
