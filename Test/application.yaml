# 应用 Nacos 行为配置（服务注册 / 服务发现 / 配置变更监听）
nacos:
  # 是否启用 Nacos 注册
  enable_nacos_register: true
  # Nacos 配置中心 dataId / group / tenant（按项目区分，与 nacos.yaml 连接配置分离）
  service_config:
    data_id: swoolefy.env
    group: DEFAULT_GROUP
    tenant: ''
  # 本服务器信息注册到 Nacos
  service_register:
    # 注册 IP 读取顺序：NACOS_SERVICE_REGISTER_HOST（本地开发）→ POD_IP（K8s/ACK）→ YAML ip → 自动探测
    ip: 192.168.1.102
    # 优先读取 NACOS_SERVICE_REGISTER_PORT 环境变量。一般不需要配置，除非docker映射端口不一致。默认读取cli.php环境变量WORKER_PORT
    # port: 9501
    service_name: my-service
    heartbeat_interval: 10   # 心跳间隔（秒）
    namespace_id: ''
    group_name: 'pwa_group'
    weight: 1
    ephemeral: true
    metadata:
      version: 1.0.0

  # 客户端的服务发现配置
  discovery_service_client:
    load_balancer: random   # random | round_robin | weight
    cache_ttl: 60
    healthy_only: true
    namespace_id: ''
    group_name: 'pwa_group'

  # 监控配置变化
  enable_nacos_config_change_restart: true
  monitor_config_change:
    listener_timeout_ms: 30000
    failed_wait_ms: 3000
